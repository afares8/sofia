name: Incident team isolated checks

# Manual only: this change must not activate paid agents or hosted jobs on push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  incident-team:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Test isolated contracts and guardrails
        working-directory: backend
        run: python -m pytest tests/test_incident_team.py tests/test_business_contracts.py tests/test_codex_cli_service.py tests/test_db_service.py tests/test_models.py tests/test_ingest.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: frontend
        run: npm ci --ignore-scripts
      - working-directory: frontend
        run: npm run build
