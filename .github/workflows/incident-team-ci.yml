name: Incident team isolated checks

# Ordinary PR tests only. No agent, application startup or deployment jobs.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incident-team-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  incident-team:
    # Standard hosted runners are free for this public repository. Fail closed
    # if visibility changes; never select a larger or self-hosted runner here.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOFIA_DB_PATH: ${{ runner.temp }}/sofia-ci.db
      SOFIA_CONFIG_PATH: ${{ runner.temp }}/sofia-ci-config.json
      SOFIA_CODEX_BIN: /nonexistent/sofia-ci-no-model
      SOFIA_API_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Test isolated contracts and guardrails
        working-directory: backend
        run: python -m pytest tests/test_incident_team.py tests/test_business_contracts.py tests/test_codex_cli_service.py tests/test_db_service.py tests/test_models.py tests/test_ingest.py tests/test_restore_health.py tests/test_self_health.py -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - working-directory: frontend
        run: npm ci --ignore-scripts
      - working-directory: frontend
        run: npm run build
